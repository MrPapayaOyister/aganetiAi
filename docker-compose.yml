services:
  # ── Corporate second-brain vector memory ──────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_memory
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Separated from the memory/ python package (see project_overview/CURRENT_GAPS.md).
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped

  whisper_stt:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whisper_stt
    ports: ["5003:9000"]
    environment:
      - ASR_MODEL=base.en
    restart: unless-stopped

  piper_tts:
    image: ghcr.io/rhasspy/piper:latest
    container_name: piper_tts
    ports: ["5002:5002"]
    volumes: ["./tts_models:/models"]
    command: --model /models/en_US-lessac-medium.onnx --port 5002
    restart: unless-stopped

  # ── Neo4j graph database for knowledge graph ───────────────
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j

    restart: unless-stopped

    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt

    environment:
      NEO4J_AUTH: neo4j/tfyfu8ub
      NEO4J_dbms_security_auth__enabled: "true"

    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/plugins:/plugins
      - ./neo4j/import:/import