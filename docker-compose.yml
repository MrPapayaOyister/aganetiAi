
services:
  # Module: Ultra-Lightweight C++ Inference Engine
  llama_server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: local_llm_core
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    command: >
      -m /models/${LLM_MODEL_PATH}
      --host 0.0.0.0
      --port 8080
      -c 8192
      -t 8 
      --embeddings
      --pooling last
    restart: unless-stopped
    mem_limit: 12g
    memswap_limit: 12g

  # Module: Corporate Second Brain Vector Memory
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_memory
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./memory:/qdrant/storage
    restart: unless-stopped

  # Module: Low-Latency Fast Inference Engine (1.5B Qwen)
  llama_fast:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama_fast
    mem_limit: 4g
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./models:/models
    command: >
      -m /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 4096
      --threads 4
      --n-predict 512
      --no-mmap
